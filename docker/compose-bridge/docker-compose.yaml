
services:
  mysql:
    image: "mysql:8"
    container_name: mysql
    hostname: mysql
    restart: always
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: u04t3fxg0imusvi7
    volumes:
      - /app/data/n9e/mysql/data:/var/lib/mysql/
      - /app/data/n9e/initsql:/docker-entrypoint-initdb.d/
      - /app/data/n9e/etc/my.cnf:/etc/my.cnf
      - /app/data/n9e/mysql/log:/var/log/mysql
    networks:
      - jwb
    ports:
      - "6001:6001"

  redis:
    image: "redis:6.2"
    container_name: redis
    hostname: redis
    restart: always
    environment:
      TZ: Asia/Shanghai
    volumes:
      - /app/data/n9e/redis:/data
    networks:
      - jwb
    ports:
      - "6002:6002"

