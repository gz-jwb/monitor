  nightingale:
    image: flashcatcloud/nightingale:v8.0.0-beta.10
    container_name: nightingale
    hostname: nightingale
    restart: always
    environment:
      GIN_MODE: release
      TZ: Asia/Shanghai
      WAIT_HOSTS: mysql:6001, redis:6002
    volumes:
      - /app/data/n9e/etc/:/app/etc
    networks:
      - jwb
    ports:
      - "5007:5007"
      - "5008:5008"
    depends_on:
      - mysql
      - redis
      # - victoriametrics
    command: >
      sh -c "/app/n9e"

